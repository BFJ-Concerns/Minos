# Production-shaped service configuration. Replace every REPLACE_WITH value
# before go-live; the paths are the locations installed by docs/go-live.md.

[service]
bot-login = "REPLACE_WITH_FORGEJO_BOT_LOGIN"

[listener]
bind = ":8919"

[forges.forgejo]
adaptation = "/opt/minos/adaptations/forgejo"
api-base = "REPLACE_WITH_FORGEJO_BASE_URL"
webhook-secret-file = "/etc/minos/webhook.secret"
credential-file = "/etc/minos/forgejo.token"
signature-header = "X-Forgejo-Signature"

[finding-destinations.engineering-backlog]
adaptation = "/opt/minos/adaptations/finding-destination"
endpoint = "REPLACE_WITH_FINDING_DESTINATION_ENDPOINT"
credential-file = "/etc/minos/finding-destination.token"
expected-principal = "REPLACE_WITH_FINDING_DESTINATION_PRINCIPAL"

[runs]
dir = "/var/lib/minos/runs"
max-concurrent = 3

[sweep]
liveness-threshold = "60m"
log = "/var/log/minos/sweep.log"

[scrub]
# Keep every service credential out of commands run in PR-controlled workspaces.
vars = ["FORGEJO_TOKEN", "ANTHROPIC_API_KEY", "OPENAI_API_KEY", "MINOS_FORGE_TOKEN"]
