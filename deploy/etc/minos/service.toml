[service]
bot-login = "REPLACE_WITH_FORGEJO_BOT_LOGIN"
# The identity on every commit Minos makes (filed issue logs, the failure
# ledger). Unset, the name is the bot login and the email is that login at
# minos.invalid.
# commit-author-name = "Minos"
# commit-author-email = "minos@example.org"
# The context of every commit status Minos writes, and the only context the
# sweep reads as its completion marker; a status under any other context is
# not Minos's. Unset, it is Minos.
# status-context = "Minos"

[listener]
bind = ":8919"

[forges.forgejo]
adaptation = "/opt/minos/adaptations/forgejo"
api-base = "REPLACE_WITH_FORGEJO_BASE_URL"
webhook-secret-file = "/etc/minos/webhook.secret"
credential-file = "/etc/minos/forgejo.token"
signature-header = "X-Forgejo-Signature"

# Per-repository knobs, set once here for every opted-in repository; any
# repository's own file under repos/ overrides a knob whole. Unset at both
# levels, a repository gets: threshold High, its own checked-in guidance
# (the first present of AGENTS.md, CLAUDE.md, README.md), a pull-request
# comment as its filing destination, and no work-in-progress prefixes.
[repositories]
# work-in-progress-branch-prefixes = ["structural/"]
# [repositories.review]
# threshold = "High"
# Guidance sources: the documents that carry each project's declared intent,
# read in this order. A source names a path in the reviewed repository, or a
# path in a named secondary repository on the same forge (cloned read-only
# beside the workspace).
# [[repositories.guidance-sources]]
# path = "AGENTS.md"
# Filing destination for a clean run's confirmed advisory material and brief
# diagnostics: kind "file" (path required; repository optional, the reviewed
# repository's default branch when omitted), "issue" (repository required),
# "pull-request-comment", or "none".
# [repositories.filing-destination]
# kind = "pull-request-comment"

# Workflow role routing: which engine, model and effort each role runs on.
# Roles: exploration, proposer, verifier, engagement-gate, brief-planner.
# A role left unset defaults at run time: with both engines provisioned
# (both configuration seeds named in run-body.env) every proposing and
# planning role runs on codex (gpt-6-sol) and the verifier on claude
# (claude-opus-5-5) — the documented recommendation, so a finding is
# checked by the family that did not propose it; with one engine
# provisioned every role runs on it. A model needs its engine named.
[routing]
# [routing.verifier]
# engine = "claude"
# model = "claude-opus-5-5"
# effort = "medium"

[runs]
dir = "/var/lib/minos/runs"
failure-log = "/var/lib/minos/failures.log"
failures-repo = "/var/lib/minos/failure-ledger"
failures-credential-file = "/etc/minos/forgejo.token"
archive-command = "/opt/minos/run-body/archive-run"
max-concurrent = 6
# Service-only limits; omitted values take these defaults. The concurrency
# cap must not exceed the envelope in GiB. Keep the installed runs slice's
# MemoryMax at this envelope and MemoryHigh below it.
# memory-envelope-gib = 22
# Go duration of at least 1us (for example "12h" or "90m").
# duration-ceiling = "12h"
# Percentage of the run ceiling in anonymous memory plus swap (1–100).
# pressure-threshold-percent = 85

[ensemble]
concurrency-claude = 10
concurrency-codex = 6
# Caps a workflow's live agents across both engines together; unset leaves
# the runtime's default.
agent-ceiling = 12
