[service]
bot-login = "REPLACE_WITH_FORGEJO_BOT_LOGIN"
# The identity on every commit Minos makes (filed issue logs, the failure
# ledger). Unset, the name is the bot login and the email is that login at
# minos.invalid.
# commit-author-name = "Minos"
# commit-author-email = "minos@example.org"
# The context of every commit status Minos writes, and the only context the
# sweep reads as its completion marker; a status under any other context is
# not Minos's. Unset, it is Minos.
# status-context = "Minos"

[listener]
bind = ":8919"
# The one operator credential that signs a browser in to the web page, a
# secret in a file as the webhook secret is. With this key set the receiver
# serves the page at the root of the listener; without it, no page.
page-credential-file = "/etc/minos/page.credential"

# One [forges.<key>] table per forge Minos reviews on; the key is the
# webhook route suffix (/hooks/<key>) and the "forge" value of each
# repository file. The credential file's content is handed whole to the
# adaptation: a Forgejo access token, or a GitHub App registration.
[forges.forgejo]
adaptation = "/opt/minos/adaptations/forgejo"
api-base = "REPLACE_WITH_FORGEJO_BASE_URL"
# Canonical web base for status Details links (absolute http(s) URL).
# Unset, links use api-base with a trailing /api/v1 removed.
# web-base = "https://forge.example"
webhook-secret-file = "/etc/minos/webhook.secret"
credential-file = "/etc/minos/forgejo.token"
signature-header = "X-Forgejo-Signature"

# GitHub: Minos acts as a GitHub App installed on each reviewed repository.
# The credential file is a JSON object with "app-id" and
# "private-key-file", the App's ID and the path to its private key.
# The adaptation looks up the installation for each repository and mints
# a short-lived token for that installation. The App's webhook posts events
# from every installed repository to /hooks/github. GitHub signs them with
# the secret in webhook-secret-file and sends the signature in
# X-Hub-Signature-256. The App's login is its slug with GitHub's "[bot]"
# suffix, for example "minos-review[bot]": make it the service's bot-login
# when GitHub is the only forge, or this table's bot-login when another
# forge's account holds the service's.
# [forges.github]
# adaptation = "/opt/minos/adaptations/github"
# api-base = "https://api.github.com"
# webhook-secret-file = "/etc/minos/github-webhook.secret"
# credential-file = "/etc/minos/github-app.json"
# signature-header = "X-Hub-Signature-256"
# bot-login = "minos-review[bot]"

# Per-repository knobs, set once here for every opted-in repository; any
# repository's own file under repos/ overrides a knob whole. Unset at both
# levels, a repository gets: threshold High, no safeguard requests filed,
# standard review depth, the specialist review, its own checked-in guidance (the first present of
# AGENTS.md, CLAUDE.md, README.md), a pull-request comment as its filing
# destination, and no work-in-progress prefixes.
[repositories]
# work-in-progress-branch-prefixes = ["structural/"]
# Admission defaults to ready pull requests from the same repository.
# A repository's [admission] table replaces this whole table.
# [repositories.admission]
# labels = ["Ready"]           # Any listed label admits, subject to the other rules.
# exclude-labels = ["Blocked"] # Any listed label excludes.
# authors = ["trusted-user"]
# base-branches = ["main"]
# drafts = "ready"             # ready, any or only
# title-pattern = '^Release '
# paths = ["internal/", "docs/*.md"]  # Directory prefix or Go path.Match pattern.
# allow-forks = false
# [repositories.review]
# threshold = "High"
# A confirmed request for a safeguard against a failure nobody has observed
# never gates; set true, it goes to the filing destination marked as a
# safeguard request, and unset or false it is filed nowhere.
# file-safeguard-requests = false
# The review depth preset steers how wide the exploration leg plans and how
# deeply the specialists read: light, standard or thorough. It never bounds
# the findings a review returns.
# depth = "standard"
# The review mode says which review a head gets: specialist, where an
# exploration leg plans the review and a specialist reads for each concern,
# or quick, where one general reviewer reads the change for every kind of
# problem, dividing it among several only when it is too large for one.
# Either way every finding is merged and verified before it is published.
# mode = "specialist"
# Push inspection reads each new head before any review and chooses no
# review, a review of what changed since the head Minos last finished on,
# or a full review. Outcomes lists the ones it may choose; full is required.
# [repositories.push-inspection]
# outcomes = ["no-review", "increment", "full"]
# The repository description: an account of the repository's structure,
# components and how they connect, which reviewers are shown beside the
# guidance sources. Set true, the sweep writes one from the default branch
# and writes it again each time that branch moves; unset or false, none is
# written and a kept one is removed.
# [repositories.description]
# enabled = false
# The walkthrough: an overview of each reviewed head's pull request, grouped
# by what changed with the files each group touched, which the summary
# comment carries once the head is finished. Diagrams adds sequence diagrams
# of the flows the change touches, and applies only where the walkthrough is
# on. Each is off unless enabled, and a walkthrough that cannot be written
# is reported in the run's report and never changes how the run ended.
# [repositories.walkthrough]
# enabled = false
# diagrams = false
# Guidance sources: the documents that carry each project's declared intent,
# read in this order. A source names a path in the reviewed repository, or a
# path in a named secondary repository on the same forge (cloned read-only
# beside the workspace).
# [[repositories.guidance-sources]]
# path = "AGENTS.md"
# Filing destination for a clean run's confirmed advisory material and brief
# diagnostics: kind "file" (path required; repository optional, the reviewed
# repository's default branch when omitted), "issue" (repository required),
# "pull-request-comment", or "none".
# [repositories.filing-destination]
# kind = "pull-request-comment"
# Markers Minos writes on a pull request, each a reaction or a label: in-flight
# while a run reviews it, clean on a clean outcome, and attention on a
# request-changes outcome. Unset, in-flight is the eyes reaction, clean the +1
# reaction, and no attention marker is written. A label must already be
# defined on the repository or its organisation; Minos never creates labels,
# and refuses the marker write when the label is missing. A repository's own
# markers table replaces this one whole.
# [repositories.markers]
# in-flight = {reaction = "eyes"}
# clean = {reaction = "+1"}
# attention = {label = "REPLACE_WITH_ATTENTION_LABEL"}

# Workflow role routing: which engine, model and effort each role runs on.
# Roles: exploration, proposer, verifier, brief-planner, judgement,
# description, walkthrough and walkthrough-diagrams.
# With both engines provisioned, proposing and planning roles default to
# Codex. The proposer uses gpt-6.2-astra and the planning roles gpt-6.1-sol.
# The verifier, the judgement stages and the description stage default to
# Claude at medium effort (claude-opus-5-5). The walkthrough defaults to
# Claude and its diagrams to Codex (gpt-6.1-sol), both at xhigh effort.
# With one engine provisioned
# every role runs on it. The verifier's routing also carries the finding
# merge. A model needs its engine named.
#
# A specialist concern (failure, fit, logic, security, tests) proposes on the
# proposer's routing unless [routing.concerns.<concern>] sets its own: the
# fields it sets replace the proposer's, and a concern moved to another
# engine without a model takes that engine's proposer default. Each finding
# is verified on the family that did not propose it where both engines are
# provisioned, so a concern moved to claude is verified on the proposer's
# codex routing.
#
# This table is the service-wide routing. A repository's own [routing]
# replaces any role or concern it sets, whole: the fields it leaves out take
# the defaults above, not the values set here.
[routing]
# [routing.verifier]
# engine = "claude"
# model = "claude-opus-5-5"
# effort = "medium"
# [routing.concerns.security]
# effort = "high"

[runs]
dir = "/var/lib/minos/runs"
failure-log = "/var/lib/minos/failures.log"
failures-repo = "/var/lib/minos/failure-ledger"
# Forge serving the ledger origin; defaults to the sole configured forge.
# Required with failures-repo when several forges are configured.
# failures-forge = "REPLACE_WITH_FORGE_KEY"
# The selected adaptation interprets this credential (token or App registration).
failures-credential-file = "/etc/minos/forgejo.token"
archive-command = "/opt/minos/run-body/archive-run"
# How many review runs may be live at once; unset, one (runs are
# serialised). Raising it reviews more pull requests in parallel, each run
# taking its share of the memory envelope below.
# max-concurrent = 1
# Service-only limits; omitted values take these defaults. The concurrency
# cap must not exceed the envelope in GiB. Keep the installed runs slice's
# MemoryMax at this envelope and MemoryHigh below it.
# memory-envelope-gib = 8
# Go duration of at least 1us (for example "12h" or "90m").
# duration-ceiling = "12h"
# Percentage of the run ceiling in anonymous memory plus swap (1–100).
# pressure-threshold-percent = 85

[ensemble]
# Live agents a review workflow may run at once on each engine. Each engine
# defaults to 2 when its key is omitted. Raising one uses more of that
# engine's allowance and the box's memory.
# concurrency-claude = 2
# concurrency-codex = 2
# Caps a workflow's live agents across both engines together. Unset, there
# is no combined cap: only the per-engine limits above apply. Setting it
# bounds a run's total agents; raising it lets more run at once across both
# engines, up to the per-engine limits.
# agent-ceiling = 4
