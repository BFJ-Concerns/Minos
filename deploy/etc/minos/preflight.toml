# Standalone readiness gate. Replace every REPLACE_WITH value before cutover.

[forge]
api-base = "REPLACE_WITH_FORGEJO_BASE_URL/api/v1"
credential-file = "/etc/minos/forgejo.token"
expected-login = "REPLACE_WITH_FORGEJO_BOT_LOGIN"
permission-repository = "REPLACE_WITH_OWNER/REPLACE_WITH_REPOSITORY"
required-permissions = ["pull", "push"]

[[engine]]
name = "claude"
command = "/usr/local/bin/claude"
# The prompt is deliberately trivial: this proves the pinned model is served
# before an expensive lifecycle is admitted.
args = ["--print", "--output-format", "json", "--model", "{model}", "Reply with OK."]
models = ["claude-sonnet-5"]

[registry]
# No registry is commissioned in the current deployment.
enabled = false

[alert]
# This filesystem stream is the narrowest honest alert route currently
# commissioned. An external monitor must watch it; no pager transport exists.
directory = "/var/lib/minos/incidents"

[toolchain]
binaries = ["minos", "claude", "codex", "ensemble", "go", "git", "curl", "jq", "python3", "sh"]
