# Minos run sessions are transient systemd --user units (systemd-run from
# the receiver and sweep), so they take PATH from the user manager, not from
# any .service file. The manager's default PATH omits per-user bins, where
# the agent CLIs the run body launches are commonly installed.
PATH=${HOME}/.cargo/bin:${HOME}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
