# Pump-19 run sessions are transient systemd --user units (systemd-run from
# the receiver and sweep), so they take PATH from the user manager, not from
# any .service file. The manager default omits rustup and per-user bins,
# which 127s every cargo build/test gate.
PATH=${HOME}/.cargo/bin:${HOME}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
