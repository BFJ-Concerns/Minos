name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.27.2'
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: '>=26.12.0'
          check-latest: true
      - uses: extractions/setup-just@v4
      # jq ships on the hosted Ubuntu image. The same command a dev box
      # runs: what the gate checks lives in the justfile.
      - name: Verify
        run: just verify
