name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a release tag of the form vMAJOR.MINOR.PATCH, got $TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$TAG^{tag}"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build Linux amd64 binary
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
          GOTOOLCHAIN: local
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -o dist/minos-linux-amd64 ./cmd/minos
          version=$(dist/minos-linux-amd64 --version)
          if [[ "$version" != "${TAG#v}" ]]; then
            echo "Binary reports version $version, expected ${TAG#v}" >&2
            exit 1
          fi
      - name: Publish release and verify asset digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object=$(git rev-parse "refs/tags/$TAG")
          remote_tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          if [[ "$tag_object" != "$remote_tag_object" ]]; then
            echo "Release tag $TAG changed after checkout" >&2
            exit 1
          fi

          asset=dist/minos-linux-amd64
          digest=$(sha256sum "$asset")
          expected="sha256:${digest%% *}"
          gh release create "$TAG" "$asset" --verify-tag --notes-from-tag --title "$TAG"

          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.name == "minos-linux-amd64" and .state == "uploaded") | .digest')
          if [[ "$published" != "$expected" ]]; then
            echo "Release asset digest mismatch: expected $expected, got $published" >&2
            exit 1
          fi
          echo "Verified minos-linux-amd64: $published"
