# Pump-19 daemon deployment example.
# Paths are resolved relative to this TOML file unless they are absolute.

trigger_pack = "adaptations/trigger/triggers.toml"
prompt_pack = "adaptations/prompt/prompt-pack.toml"
mechanical_pack = "adaptations/mechanical/mechanical.toml"
# Durable operator-facing operational events are appended to
# state/operator.log.jsonl beside the per-PR run state.
state_root = "state"

[workspace]
root = "workspaces"
image = "localhost/pump19-workspace:stable"

[ensemble]
node_program = "node"
launcher_path = "node_modules/.bin/ensemble"
archive_root = "archives"
timeout_ms = 600000

[archive_retention]
# Default: keep every terminal frame-run archive for 14 days before pruning.
keep_days = 14
# Default: preserve at least two terminal archives for each pull request even
# after they age out, so a quiet PR still has recent provenance to inspect.
keep_terminal_runs_per_pr = 2
# Default: once archives are outside the age window, keep at most this many
# terminal archives per pull request. Set higher for repositories with long
# review loops that need a deeper audit trail.
max_terminal_runs_per_pr = 50

[forgejo]
repositories = ["REPLACE_WITH_OWNER/REPOSITORY"]
finish_label = "Ready"
# Optional pump-side subject intent, keyed by the same owner/repository slug used
# above. Repositories without an entry are reviewed with neutral subject text
# derived from their slug; no file is required in the reviewed repository.
#
# [forgejo.repository_intents."REPLACE_WITH_OWNER/REPOSITORY"]
# name = "Example Service"
# slug = "example-service"
# purpose = "Review changes to the Example Service for correctness and maintainability."
# Forge web root for file permalinks in finding comments; omit for plain
# path:line code spans.
# web_base_url = "https://forgejo.example"
# Off by default: when false, a person applies the finish label after convergence.
# Set true only for repositories where agent-authored code may merge without human review.
# core_applies_finish_label_on_convergence = false

[forgejo.poll_command]
program = "commands/pump19-forgejo-poll"
args = ["--base-url", "REPLACE_WITH_FORGEJO_BASE_URL", "--finish-label", "Ready"]

[forgejo.poll_command.env]
FORGEJO_TOKEN = "env:FORGEJO_TOKEN"
PUMP19_STATE_ROOT = "state"

[forgejo.operation_command]
program = "commands/pump19-forgejo-operation"
args = ["--base-url", "REPLACE_WITH_FORGEJO_BASE_URL"]

[forgejo.operation_command.env]
FORGEJO_TOKEN = "env:FORGEJO_TOKEN"

[loop_control]
# Default: 5000.
poll_interval_ms = 5000
# Default: keep polling until SIGINT/SIGTERM.
# stop_after_quiet_polls = 1
