# Pump-19 daemon deployment example.
# Paths are resolved relative to this TOML file unless they are absolute.

trigger_pack = "adaptations/trigger/triggers.toml"
prompt_pack = "adaptations/prompt/prompt-pack.toml"
mechanical_pack = "adaptations/mechanical/mechanical.toml"
state_root = "state"

[workspace]
root = "workspaces"
image = "localhost/pump19-workspace:stable"

[ensemble]
node_program = "node"
launcher_path = "node_modules/.bin/ensemble"
archive_root = "archives"
timeout_ms = 600000

[forgejo]
repositories = ["REPLACE_WITH_OWNER/REPOSITORY"]
finish_label = "pump19-finish"
# Off by default: when false, a person applies the finish label after convergence.
# Set true only for repositories where agent-authored code may merge without human review.
# core_applies_finish_label_on_convergence = false

[forgejo.poll_command]
program = "commands/pump19-forgejo-poll"
args = ["--base-url", "REPLACE_WITH_FORGEJO_BASE_URL", "--finish-label", "pump19-finish"]

[forgejo.poll_command.env]
FORGEJO_TOKEN = "env:FORGEJO_TOKEN"

[forgejo.operation_command]
program = "commands/pump19-forgejo-operation"
args = ["--base-url", "REPLACE_WITH_FORGEJO_BASE_URL"]

[forgejo.operation_command.env]
FORGEJO_TOKEN = "env:FORGEJO_TOKEN"

[loop_control]
# Default: 5000.
poll_interval_ms = 5000
# Default: keep polling until SIGINT/SIGTERM.
# stop_after_quiet_polls = 1
