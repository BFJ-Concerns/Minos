id = "baseline-mechanical"

[schema_version]
major = 1
minor = 0

[contract_version]
major = 1
minor = 7

[[steps]]
id = "prepare-source"
inputs = [
    "source_preparation_command_input_json",
    "forge_repository",
    "pull_request_head",
]
outputs = [
    "prepared_source_tree",
    "prepared_revision",
]

[steps.kind]
kind = "checkout"

[steps.execution]
executor = "command"
program = "commands/pump19-prepare-source"

[[steps]]
id = "merge-readiness"
inputs = [
    "merge_readiness_command_input_json",
    "forge_repository",
    "pull_request_head",
]
outputs = ["merge_readiness_verdict_json"]

[steps.kind]
kind = "custom"
name = "merge-readiness"

[steps.execution]
executor = "command"
program = "commands/pump19-merge-readiness"

[[steps]]
id = "format-comments"
inputs = [
    "finding_comment_format_request_json",
    "finding",
    "judge_decision",
    "forge_facts",
]
outputs = ["finding_comment_body_json"]

[steps.kind]
kind = "format_comments"

[steps.execution]
executor = "command"
program = "commands/pump19-format-comments"
