forge = "forgejo-org"
owner = "BFJ-Concerns"
repo = "Widget"

[adaptation]
build = "cargo build --workspace"
test = "cargo test --workspace"
briefs = ".review"
skill = "/opt/pump19/skills/foundry/agent-review/SKILL.md"
run-body = "/opt/pump19/run-body/run-body"

[policy]
auto-merge = false

[[trigger]]
run = "review"
on = ["pr-opened", "pr-reopened", "pr-synchronized", "pr-edited"]
authors = ["*"]
drafts = false

# A rejected review fires a fix run; the landed fix re-fires review as an
# ordinary PR update. A fruitless or unwritable-head fix stops the loop at the
# standing findings — no re-review on an unchanged head.
[[trigger]]
run = "fix"
on = ["review-rejected"]
authors = ["*"]

# Ready fires finish (permissive); the finish run's own gate protects the tree.
# auto-merge is off, so only these actors' Ready is honoured — a human merge
# gate. Set real forge logins with merge authority before relying on it; the
# placeholder authorises nobody, so finish stays inert until then.
[[trigger]]
run = "finish"
on = ["label-added:Ready"]
actors = ["REPLACE_WITH_AUTHORISED_FINISH_LOGINS"]

# CI and the Pump-19 service may apply Flaky Tests. The sweep applies this same
# actor guard to the label already standing on Widget PR #18, so activation does
# not depend on observing a fresh webhook.
[[trigger]]
run = "flaky"
on = ["label-added:Flaky Tests"]
actors = ["bob", "pump19"]
