forge = "forgejo"
owner = "BFJ-Concerns"
repo = "Widget"

[adaptation]
build = "cargo build --workspace"
test = "cargo test --workspace"
briefs = ".review"
skill = "/opt/pump19/skills/foundry/review-panel/SKILL.md"
run-body = "/opt/pump19/run-body/run-body"

[policy]
auto-merge = true

[retries]
operational-attempts = 5

[[trigger]]
run = "review"
on = ["pr-opened", "pr-reopened", "pr-synchronized", "pr-edited"]
authors = ["*"]
drafts = false

# A rejected review triggers a fix run; the landed fix re-triggers review as an
# ordinary PR update. A fruitless or unwritable-head fix stops the loop at the
# standing findings — no re-review on an unchanged head.
[[trigger]]
run = "fix"
on = ["review-rejected"]
authors = ["*"]

# Ready triggers finish; the finish run's own gate protects the tree. With
# auto-merge on, the review run applies Ready on convergence as Minos, and the
# operator may apply Ready by hand — both actors are honoured here.
[[trigger]]
run = "finish"
on = ["label-added:Ready"]
actors = ["bob", "Minos"]

# CI and the Pump-19 service may apply Flaky Tests. The sweep applies this same
# actor guard to the label already standing on Widget PR #18, so activation does
# not depend on observing a fresh webhook.
[[trigger]]
run = "flaky"
on = ["label-added:Flaky Tests"]
actors = ["bob", "Minos", "forgejo-actions"]
