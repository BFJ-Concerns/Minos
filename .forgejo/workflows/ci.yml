# CI on Forgejo Actions (self-hosted runner).
#
# fmt, clippy (warnings denied), and the Rust workspace suite via
# cargo-nextest. The nextest ci profile retries failures so flaky tests
# (fail, then pass on retry) surface as a "Flaky Tests" label on the PR
# instead of hiding behind a lucky green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: docker
    container:
      image: rust:1
    steps:
      # jq for the labelling step.
      - name: Install system deps
        run: apt-get update -qq && apt-get install -y -qq jq

      - uses: actions/checkout@v4

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # Red runs still warm the cache.
          cache-on-failure: true

      # The rust image's toolchain ships without these components.
      - name: Install toolchain components
        run: rustup component add rustfmt clippy

      # Pinned rather than `latest`: bump deliberately (supply-chain
      # cooling-off — pick releases at least a week old).
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/0.9.138/linux | tar zxf - -C /usr/local/cargo/bin

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (nextest, ci profile)
        run: cargo nextest run --workspace --profile ci

      # A flaky test is one nextest saw fail and then pass on retry: the run
      # is green, but the junit report carries <flakyFailure> elements and the
      # log above marks the tests FLAKY. Label the PR so label-driven
      # automation can react (e.g. dispatch a test hunter).
      - name: Label PR on flaky tests
        if: always() && github.event_name == 'pull_request'
        run: |
          junit=target/nextest/ci/junit.xml
          [ -f "$junit" ] || exit 0
          n=$(grep -c '<flakyFailure' "$junit") || { echo "No flaky tests."; exit 0; }
          echo "Detected $n flaky-test retry record(s) — see FLAKY lines in the nextest step."
          api="${{ github.server_url }}/api/v1"
          repo="${{ github.repository }}"
          pr="${{ github.event.pull_request.number }}"
          label_id=$(curl -sf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "$api/repos/$repo/labels?limit=100" \
            | jq '[.[] | select(.name == "Flaky Tests")][0].id')
          if [ -z "$label_id" ] || [ "$label_id" = "null" ]; then
            echo "::warning::'Flaky Tests' label not found on $repo — create it in repo settings"
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"labels\":[$label_id]}" \
            "$api/repos/$repo/issues/$pr/labels" >/dev/null
          echo "Applied 'Flaky Tests' label to PR #$pr"
