name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # Direct pushes to main are allowed past the PR gate, so run the same
  # job on them as a post-merge tripwire.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: forgejo.event_name == 'push' || (forgejo.event.pull_request.draft == false && !startsWith(forgejo.event.pull_request.head.ref, 'structural/'))
    runs-on: docker
    container:
      # Built locally on the runner (from the runner's own image recipes): Go, node 24,
      # jq, and just preinstalled. Bump the image's base when go.mod moves
      # past the Go it carries.
      image: forge-ci/go:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.3.1
      # The same command a dev box runs. What the gate checks lives in the
      # justfile, not here, so CI and local cannot drift apart.
      - name: Verify
        run: just verify
