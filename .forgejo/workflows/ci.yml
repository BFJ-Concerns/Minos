name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches-ignore: ['structural/**']

permissions:
  contents: read

jobs:
  test:
    if: forgejo.event.pull_request.draft == false
    runs-on: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.3.1
      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24.18.0'
      - name: Install jq and just
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends jq
          curl -LsSf https://github.com/casey/just/releases/download/1.57.0/just-1.57.0-x86_64-unknown-linux-musl.tar.gz \
            | tar zxf - -C /usr/local/bin just
      # The same command a dev box runs. What the gate checks lives in the
      # justfile, not here, so CI and local cannot drift apart.
      - name: Verify
        run: just verify
