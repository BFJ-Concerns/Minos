[workspace]
members = [
    "crates/pump19-contract",
    "crates/pump19-core",
    "crates/pump19-forge-forgejo",
    "crates/pump19-judgement",
    "crates/pump19-runs",
    "crates/pump19-workspace",
    "crates/pump19-verification-estate",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
default_trait_access = "deny"
match_same_arms = "deny"
missing_errors_doc = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
serde = "1.0.228"
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
